let remoteVideos=[],remoteStatus='caricamento';
async function loadDemoCatalog(){
  try{
    const r=await fetch('https://exercise-database.zenithfits.com/api/v1/exercises?limit=400');
    if(!r.ok)throw Error('Catalogo temporaneamente non disponibile');
    const j=await r.json();remoteVideos=Array.isArray(j.data)?j.data:[];
    if(!remoteVideos.length)throw Error('Catalogo vuoto');
    let count=0;
    for(const x of state.library){
      if(x.video)continue;
      const name=VIDEO_MATCH[x.name];if(!name)continue;
      const match=remoteVideos.find(v=>normName(v.name)===normName(name));
      if(match?.videos?.male&&/^https:\/\//.test(match.videos.male)){
        x.autoVideo=match.videos.male;x.autoPoster=match.thumbnails?.male||'';count++;
      }
    }
    remoteStatus=count+' video abbinati automaticamente';render();
  }catch(e){remoteStatus='Video online non disponibili in questo momento';render();}
}

function exerciseTips(n){let x=n.toLowerCase();if(x.includes('panca')||x.includes('chest press')||x.includes('croci')||x.includes('butterfly'))return ['Sistema schiena e piedi in posizione stabile.','Esegui il movimento con traiettoria controllata e senza slanci.','Ritorna lentamente alla posizione iniziale, mantenendo il controllo.'];if(x.includes('curl')||x.includes('bicipit'))return ['Mantieni il busto stabile e i gomiti controllati.','Fletti i gomiti senza oscillare con il corpo.','Abbassa il carico lentamente.'];if(x.includes('lat')||x.includes('row')||x.includes('rematore')||x.includes('pulldown'))return ['Mantieni il tronco stabile e le spalle controllate.','Tira con i gomiti, senza strattoni.','Rilascia lentamente mantenendo tensione.'];if(x.includes('plank')||x.includes('crunch')||x.includes('dead bug'))return ['Attiva l’addome e mantieni una respirazione regolare.','Esegui lentamente senza compensare con la zona lombare.','Interrompi la serie quando perdi il controllo della posizione.'];return ['Regola l’attrezzo e prepara una posizione stabile.','Esegui le ripetizioni con movimento controllato e senza slanci.','Mantieni la tecnica anche nelle ultime ripetizioni.'];}
async function setDemoPhoto(input){let file=input.files&&input.files[0];if(!file)return;if(file.size>5*1024*1024){alert('Scegli una foto sotto 5 MB');return}let img=new Image();let url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas');let scale=Math.min(1,900/img.width,900/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);active().days[day].exercises[detailIndex].demo=c.toDataURL('image/jpeg',.72);try{save();render()}catch(e){alert('Memoria browser piena: usa una foto più piccola.')}};img.onerror=()=>alert('Immagine non valida');img.src=url;}
function clearDemoPhoto(){delete active().days[day].exercises[detailIndex].demo;save();render()}
function selectPerson(id){
 if(!PEOPLE.some(p=>p[0]===id))return;
 try{localStorage.setItem('cocazero-current-person',id)}catch(e){}
 currentPerson=id;
 let stored=null;
 try{stored=JSON.parse(localStorage.getItem('cocazero-profile-'+id)||(id==='mattia'?localStorage.getItem(LEGACY_KEY):null))}catch(e){}
 if(stored&&Array.isArray(stored.plans))state=stored;
 else{state={active:'p1',plans:[{id:'p1',name:'Scheda attuale',created:new Date().toLocaleDateString('it-IT'),days:JSON.parse(JSON.stringify(ORIGINAL_DAYS))}],logs:[],extras:[],library:[]}}
 if(!Array.isArray(state.library))state.library=[];
 for(const d of ORIGINAL_DAYS)for(const e of d.exercises)if(!libraryItem(e.name))state.library.push({id:'lib'+state.library.length,name:e.name,category:d.name,tips:'',video:'',poster:''});
 page='home';day=0;save();render();
}
function choosePersonScreen(){
 document.getElementById('tabs').innerHTML='';
 document.getElementById('main').innerHTML=`<div class="card" style="margin-top:25px;text-align:center">
 <span class="sectiontag">COCA ZERO / PERFORMANCE CLUB</span><h2>CHI SI ALLENA OGGI?</h2>
 <p class="muted">Scegli il tuo profilo. Ogni profilo salva i propri allenamenti su questo dispositivo.</p>
 <div class="grid">${PEOPLE.map(([id,name])=>`<button class="alt" style="padding:18px 10px" onclick="selectPerson('${id}')">👤 ${name}</button>`).join('')}</div>
 <p class="muted" style="font-size:12px">Questi profili non sono protetti da password e non si sincronizzano tra telefoni.</p>
 </div>`;
}
function changePerson(){save();try{localStorage.removeItem('cocazero-current-person')}catch(e){}currentPerson='';render()}
function render(){if(!currentPerson){choosePersonScreen();return}document.getElementById('tabs').innerHTML=[['home','Home'],['workout','Allenamenti'],['plans','Le mie schede'],['history','Storico'],['extra','Attività extra'],['backup','Backup']].map(([id,name])=>`<button class="${page===id?'':'alt'}" onclick="nav('${id}')">${name}</button>`).join('')+`<button class="alt" onclick="changePerson()">👤 ${PEOPLE.find(p=>p[0]===currentPerson)?.[1]||'Profilo'} · Cambia</button>`;let html='';if(page==='home'){html=`<div class="hero"><small>COCA ZERO / PERFORMANCE CLUB</small><h2>OGNI GIORNO<br><span class="accent">PIÙ FORTE.</span></h2><p>La tua palestra. Le tue sfide. I tuoi risultati.</p><button onclick="nav('workout')">INIZIA ALLENAMENTO ↗</button></div><div class="statrow"><div class="stat"><strong>${state.logs.length}</strong><small>ALLENAMENTI</small></div><div class="stat"><strong>${state.extras.length}</strong><small>ATTIVITÀ EXTRA</small></div><div class="stat"><strong>${state.plans.length}</strong><small>SCHEDE</small></div></div><div class="card"><span class="sectiontag">IL TUO PROGRAMMA</span><h2>${esc(active().name)}</h2><div class="grid">${active().days.map((d,i)=>`<button class="alt" onclick="day=${i};nav('workout')">${esc(d.name)} ↗</button>`).join('')}</div><p><button onclick="nav('plans')">Gestisci schede →</button></p></div><div class="card"><span class="sectiontag">OLTRE LA PALESTRA</span><h3>Oggi si fa sul serio?</h3><p class="muted">Registra corsa, Hyrox, sport e ogni altra attività.</p><button onclick="nav('extra')">+ REGISTRA ATTIVITÀ</button></div>`}if(page==='detail'){let d=active().days[day],e=d.exercises[detailIndex];if(!e){page='workout';render();return}let desc=exerciseTips(e.name);html=`<button class="alt" onclick="nav('workout')">← Torna agli esercizi</button><div class="card"><span class="sectiontag">GIORNO ${day+1} / TECNICA</span><h2>${esc(e.name)}</h2><p class="muted">${esc(e.sets)} serie × ${esc(e.reps)} ripetizioni · ${esc(e.rest)} sec recupero</p><button onclick="findDemo(e.name)">▶ Guarda esecuzione su YouTube ↗</button><h3>Come eseguire il movimento</h3><ol class="demo-steps">${desc.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><p class="muted">${esc(e.notes||'Esegui con controllo, senza sacrificare la tecnica.')}</p><label>Peso utilizzato (kg)</label><input value="${esc(e.weight||'')}" onchange="setWeight(detailIndex,this.value)"><button class="alt" onclick="nav('workout')">✓ Torna alla scheda</button></div>`} 
if(page==='workout'){let d=active().days[day];html=`<h2>Allenamenti</h2><div class="grid">${active().days.map((x,i)=>`<button class="${day===i?'':'alt'}" onclick="day=${i};render()">Giorno ${i+1}</button>`).join('')}</div><div class="card"><label>Nome giornata</label><input id="dayname" value="${esc(d.name)}"><button class="alt" onclick="setDayName()">Salva nome</button><h3>Esercizi</h3>${d.exercises.map((e,i)=>`<div class="exercise"><b>${i+1}. ${esc(e.name)}</b><p class="muted">${esc(e.sets)} serie × ${esc(e.reps)} ripetizioni • ${esc(e.rest)} sec recupero${e.notes?' · '+esc(e.notes):''}</p><div class="rowline" style="margin:10px 0"><button class="alt" onclick="findDemo(active().days[day].exercises[${i}].name)">▶ Guarda esecuzione su YouTube ↗</button></div><div class="set-entry"><strong>Registra ogni serie</strong><div class="set-grid">${Array.from({length:Math.max(1,Math.min(30,parseInt(e.sets,10)||1))},(_,j)=>`<div class="set-row"><span class="pill">Serie ${j+1}</span><label>Peso (kg)<input aria-label="Peso serie ${j+1}" type="number" min="0" step="0.5" inputmode="decimal" placeholder="kg" value="${esc((e.setEntries||[])[j]?.weight??(j===0?e.weight||'':''))}" onchange="setSeriesField(${i},${j},'weight',this.value)"></label><label>Rip. fatte<input aria-label="Ripetizioni serie ${j+1}" type="number" min="0" step="1" inputmode="numeric" placeholder="Rip." value="${esc((e.setEntries||[])[j]?.reps??'')}" onchange="setSeriesField(${i},${j},'reps',this.value)"></label></div>`).join('')}</div><small>I valori vengono salvati automaticamente sul dispositivo.</small></div><button class="demo-toggle" onclick="detailIndex=${i};nav('detail')">📋 Tecnica e dettagli</button><button class="alt" onclick="editExercise(${i})">Modifica</button><button class="alt" onclick="removeExercise(${i})">Elimina</button></div>`).join('')||'<p class="muted">Aggiungi gli esercizi della tua scheda attuale.</p>'}<button onclick="addExercise()">+ Aggiungi esercizio</button></div><button onclick="finishWorkout()">✓ Registra allenamento completato</button>`}if(page==='library'){let items=state.library.filter(x=>normName(x.name).includes(normName(libraryQuery)));html=`<span class="sectiontag">COCA ZERO / VIDEO ACADEMY</span><h2>📚 Libreria esercizi</h2><p class="muted">${esc(remoteStatus)} • Connessione internet necessaria per i video</p><p class="muted">Ogni video è collegato al nome dell'esercizio, non alla scheda. Quando cambi programma, il video rimane disponibile. I link video vanno aggiunti da fonti autorizzate.</p><div class="card"><label>Cerca un esercizio</label><input id="librarySearch" value="${esc(libraryQuery)}" oninput="searchLibrary(this.value)" placeholder="Es. panca, curl, plank..."><button onclick="addLibraryItem()">+ Nuovo esercizio</button><span class="pill">${state.library.length} esercizi</span></div>${items.map(x=>`<div class="card"><span class="sectiontag">${esc(x.category||'ESERCIZIO')}</span><h3>${esc(x.name)}</h3>${resolvedVideo(x)?videoEmbed(resolvedVideo(x)):'<div class="libempty">Video non ancora disponibile</div>'}<div class="rowline"><button onclick="editLibraryVideo('${x.id}')">${x.video?'Modifica video':'🔗 Collega video'}</button><button class="alt" onclick="addFromLibrary('${x.id}')">+ Aggiungi alla scheda</button></div></div>`).join('')||'<div class="card">Nessun esercizio trovato.</div>'}`}
if(page==='plans'){html=`<h2>Le mie schede</h2><div class="card"><span class="sectiontag">PROGRAMMA ATTIVO</span><h2>${esc(active().name)}</h2><p class="muted">I tuoi quattro giorni di allenamento, con tutti gli esercizi.</p><button onclick="renamePlan()">Rinomina</button><button onclick="newPlan()">+ Nuova scheda</button></div><div class="dayoverview">${active().days.map((d,i)=>`<div class="card daycard"><div class="rowline"><div><span class="pill">GIORNO ${i+1}</span><h3>${esc(d.name)}</h3></div><button onclick="day=${i};nav('workout')">${d.exercises.length?'Apri / modifica':'Aggiungi esercizi'} ↗</button></div>${d.exercises.length?d.exercises.map((e,j)=>`<div class="exercise"><b>${j+1}. ${esc(e.name)}</b><p class="muted">${esc(e.sets)} serie × ${esc(e.reps)} ripetizioni · Recupero ${esc(e.rest)} sec${e.notes?' · '+esc(e.notes):''}${e.weight?' · '+esc(e.weight)+' kg':''}</p></div>`).join(''):'<p class="muted">Non ci sono ancora esercizi salvati per questo giorno. Aprilo per inserirli.</p>'}</div>`).join('')}</div>${state.plans.map(p=>`<div class="card"><b>${esc(p.name)}</b><p class="muted">Creata il ${esc(p.created)}</p>${p.id===state.active?'<small>🟠 Attiva</small>':`<button onclick="activate('${p.id}')">Attiva questa scheda</button>`}</div>`).join('')}`}if(page==='history'){html=`<h2>Storico allenamenti</h2>${state.logs.slice().reverse().map(l=>`<div class="card"><b>${esc(l.date)}</b><p>${esc(l.plan)} — ${esc(l.day)}</p><small>${l.exercises.length} esercizi salvati</small></div>`).join('')||'<div class="card">Non hai ancora registrato allenamenti.</div>'}`}if(page==='extra'){const visible=state.extras.slice().reverse().filter(x=>extraFilter==='Tutte'||x.type===extraFilter);html=`<div class="rowline"><div><span class="sectiontag">MOVIMENTO SENZA LIMITI</span><h2>Attività extra <span class="accent">⚡</span></h2></div><span class="pill">${state.extras.length} registrate</span></div><p class="muted">Scegli uno sport, inserisci i dettagli e tieni traccia dei tuoi progressi.</p><div class="card"><h3>Scegli la tua attività</h3><div class="activities">${activities.map(([emoji,name])=>`<button class="activity ${selectedExtra===name?'selected':''}" onclick="selectExtra('${name}')"><span class="emoji">${emoji}</span><strong>${name}</strong></button>`).join('')}</div></div><div class="card" id="extraForm"><span class="sectiontag">NUOVA SESSIONE</span><h3>${esc(selectedExtra)}</h3><div class="fieldgrid"><div><label>Data</label><input type="date" id="extraDate" value="${new Date().toLocaleDateString('en-CA')}"></div><div><label>Durata (minuti)</label><input type="number" min="1" id="extraDuration" placeholder="Es. 45"></div><div><label>Distanza (km) · facoltativa</label><input type="number" step="0.01" min="0" id="extraDistance" placeholder="Es. 5"></div><div><label>Intensità</label><select id="extraIntensity"><option>Moderata</option><option>Leggera</option><option>Alta</option><option>Massima</option></select></div></div><label>Note / risultato</label><textarea id="extraNotes" rows="3" placeholder="Come è andata? Tempi, obiettivi, sensazioni..."></textarea><button onclick="saveExtra()">✓ SALVA ATTIVITÀ</button></div><div class="card"><div class="rowline"><h3>Le tue sessioni</h3><span class="pill">${visible.length}</span></div><div class="activityfilter"><button class="${extraFilter==='Tutte'?'':'alt'}" onclick="setExtraFilter('Tutte')">Tutte</button>${[...new Set(state.extras.map(x=>x.type))].map(t=>`<button class="${extraFilter===t?'':'alt'}" onclick="setExtraFilter('${esc(t)}')">${esc(t)}</button>`).join('')}</div>${visible.map(x=>`<div class="historyrow"><div class="rowline"><strong>${activities.find(a=>a[1]===x.type)?.[0]||'⚡'} ${esc(x.type)}</strong><small>${esc(x.date)}</small></div><p class="muted">${x.duration?esc(x.duration)+' min · ':''}${x.distance?esc(x.distance)+' km · ':''}${esc(x.intensity||'')} ${x.notes?' · '+esc(x.notes):''}</p><button class="alt" onclick="deleteExtra('${esc(x.id||'')}')">Elimina</button></div>`).join('')||'<p class="muted">Nessuna attività registrata per questo filtro.</p>'}</div>`}if(page==='backup'){html=`<h2>Backup dati</h2><div class="card"><p>Scarica una copia delle schede e dello storico. I dati vengono salvati in questo browser, non online.</p><button onclick="exportData()">Scarica backup JSON</button><label>Ripristina un backup</label><input type="file" accept="application/json" onchange="importData(this)"></div>`}document.getElementById('main').innerHTML=html}function setDayName(){active().days[day].name=document.getElementById('dayname').value;save();render()}function addExercise(){let name=prompt('Nome esercizio');if(!name)return;active().days[day].exercises.push({name,sets:prompt('Serie','3')||'3',reps:prompt('Ripetizioni','10')||'10',rest:prompt('Recupero in secondi','90')||'90',notes:prompt('Indicazioni (facoltative)','')||'',weight:''});save();render()}function editExercise(i){let e=active().days[day].exercises[i];e.name=prompt('Nome',e.name)||e.name;e.sets=prompt('Serie',e.sets)||e.sets;e.reps=prompt('Ripetizioni',e.reps)||e.reps;e.rest=prompt('Recupero (secondi)',e.rest)||e.rest;e.notes=prompt('Indicazioni (es. 1-2 RR, cedimento ultima)',e.notes||'')??e.notes;save();render()}function removeExercise(i){if(confirm('Eliminare questo esercizio?')){active().days[day].exercises.splice(i,1);save();render()}}function setSeriesField(i,j,field,value){
 let e=active().days[day].exercises[i];
 if(!e.setEntries)e.setEntries=[];
 if(!e.setEntries[j])e.setEntries[j]={weight:'',reps:''};
 e.setEntries[j][field]=value;
 if(field==='weight'&&j===0)e.weight=value;
 save();
}function finishWorkout(){let d=active().days[day];state.logs.push({date:new Date().toLocaleString('it-IT'),plan:active().name,day:d.name,exercises:JSON.parse(JSON.stringify(d.exercises))});save();alert('Allenamento registrato!');nav('history')}function renamePlan(){let p=active(),v=prompt('Nome scheda',p.name);if(v&&v.trim()){p.name=v.trim();save();render()}}function newPlan(){let name=prompt('Nome della nuova scheda');if(!name)return;let p={id:'p'+Date.now(),name,created:new Date().toLocaleDateString('it-IT'),days:JSON.parse(JSON.stringify(active().days))};state.plans.push(p);state.active=p.id;save();render()}function activate(id){state.active=id;save();render()}function selectExtra(type){selectedExtra=type;render();document.getElementById('extraForm')?.scrollIntoView({behavior:'smooth',block:'start'})}function setExtraFilter(type){extraFilter=type;render()}function saveExtra(){const date=document.getElementById('extraDate').value,duration=document.getElementById('extraDuration').value,distance=document.getElementById('extraDistance').value,intensity=document.getElementById('extraIntensity').value,notes=document.getElementById('extraNotes').value.trim();if(!date){alert('Inserisci una data');return}if(duration&&Number(duration)<=0){alert('La durata deve essere positiva');return}state.extras.push({id:'x'+Date.now()+Math.random().toString(36).slice(2,6),type:selectedExtra,date,duration,distance,intensity,notes});save();render();alert('Attività registrata! 💪')}function deleteExtra(id){if(!id){alert('Questa vecchia registrazione non ha un identificativo: puoi conservarla o eliminarla tramite backup.');return}if(confirm('Eliminare questa attività?')){state.extras=state.extras.filter(x=>x.id!==id);save();render()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='coca-zero-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(input){let f=input.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.plans)||!Array.isArray(x.logs)||!Array.isArray(x.extras))throw Error('Formato non valido');if(confirm('Sostituire i dati attuali con il backup?')){state=x;save();render()}}catch(e){alert('Backup non valido')}}render();
